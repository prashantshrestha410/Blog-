<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prashant Shrestha | Blog</title>
    <style>
        /* Modern, minimal layout */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #fcfcfc;
        }
        header {
            margin-bottom: 40px;
        }
        h1 {
            font-size: 2.5rem;
            color: #111;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }
        .post-list {
            list-style: none;
            padding: 0;
            margin-top: 40px;
        }
        .post-item {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .post-item a {
            color: #0066cc;
            text-decoration: none;
            font-size: 1.4rem;
            font-weight: bold;
        }
        .post-item a:hover {
            text-decoration: underline;
        }
        .post-date {
            color: #888;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        footer {
            margin-top: 80px;
            font-size: 0.9rem;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Prashant Shrestha</h1>
        <p class="subtitle">Welcome to my personal blog. I write about coding, web development, and building things from scratch.</p>
    </header>

    <main>
        <h2>Latest Articles</h2>
        <ul class="post-list">
            
            <!-- This is where your first post link sits -->
            <li class="post-item">
                <a href="my-first-blog.html">My First Blog Post: Building from Scratch</a>
                <div class="post-date">Published on November 26, 2026</div>
            </li>
            
            <!-- When you write a second article, you will copy/paste a new <li> block right here! -->

        </ul>
    </main>

    <footer>
        <p>© 2026 Prashant Shrestha. All rights reserved.</p>
    </footer>

</body>
</html>
